name: Open canonical Brand Reference pull request

on:
  push:
    branches: [docs/canonical-brand-reference]
    paths:
      - ".github/workflows/phase3-open-pr.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.repository }}-open-canonical-brand-reference-pr
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open draft pull request when absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --repo "${GITHUB_REPOSITORY}" --head docs/canonical-brand-reference --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]
          then
            echo "Draft pull request already exists: ${existing}"
            exit 0
          fi
          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --head docs/canonical-brand-reference \
            --base main \
            --draft \
            --title "Add the canonical Atlas Systems brand reference" \
            --body "Adds the repository-owned docs/BRAND_REFERENCE.md, replaces stale remote-font guidance with the current repository-local bundle contract, links it from the README and consumer contract, and adds source-alignment tests. No token, bundle, provider, or deployment behaviour changes."
