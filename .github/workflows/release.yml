name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, for example v0.2.0."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build GitHub release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Validate tag and version
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match VERSION $VERSION" >&2
            exit 1
          fi

      - name: Validate bundle
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/build.py scripts/check.py scripts/build_release.py
          python3 scripts/check.py
          python3 -m unittest discover -s tests -v
          git diff --exit-code
          git diff --check

      - name: Build release artifact
        run: |
          set -euo pipefail
          python3 scripts/build_release.py --output-dir reports/release
          cat reports/release/*.release-manifest.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1, Node 24
        with:
          name: atlas-interface-kit-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          path: reports/release/*
          if-no-files-found: error
          retention-days: 30
