name: Validate canonical Brand Reference branch

on:
  push:
    branches: [docs/canonical-brand-reference]
    paths:
      - ".github/workflows/phase3-validate-brand-reference.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-validate-brand-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, Node 24
        with:
          ref: docs/canonical-brand-reference
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Validate and record exact result
        run: |
          set -uo pipefail
          set +e
          (
            set -euo pipefail
            python3 -m py_compile scripts/build.py scripts/check.py
            python3 scripts/check.py
            python3 -m unittest discover -s tests -v
            git diff --exit-code -- . \
              ':!.phase3-brand-reference-validation.json' \
              ':!.phase3-brand-reference-validation.log'
            git diff --check
          ) > .phase3-brand-reference-validation.log 2>&1
          status=$?
          set -e
          if [ "${status}" -eq 0 ]
          then
            result=pass
          else
            result=fail
          fi
          printf '{"schema_version":"atlas-interface-kit/brand-reference-validation/v1","result":"%s"}\n' "${result}" > .phase3-brand-reference-validation.json
          git add .phase3-brand-reference-validation.json .phase3-brand-reference-validation.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: record Brand Reference validation result"
          git push origin HEAD:docs/canonical-brand-reference
          cat .phase3-brand-reference-validation.log
          exit "${status}"
