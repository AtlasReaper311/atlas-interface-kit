name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate interface kit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Compile tooling
        run: python3 -m py_compile scripts/build.py scripts/check.py scripts/build_release.py
      - name: Validate bundle
        run: python3 scripts/check.py
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Build release artifact dry-run
        run: python3 scripts/build_release.py --output-dir reports/release
      - name: Check generated diff
        run: git diff --exit-code
      - name: Check whitespace
        run: git diff --check
